name: clash-rule-merge

services:
  clash-rule-merge:
    image: iuupub/clash-rule-merge:latest
    container_name: clash-rule-merge
    restart: unless-stopped
    ports:
      - "5090:5090"
      # 走反向代理时改为只监听本机
      # - "127.0.0.1:5090:5090"
    environment:
      # ALLOW_HOSTS: jmssub.net
      RULE_TTL: 12h
      # PUBLIC_URL: https://sub.example.com
      # TEMPLATE: /etc/clash-rule-merge/template.yaml
    volumes:
      - data:/data
      # - ./template.yaml:/etc/clash-rule-merge/template.yaml:ro

volumes:
  data:
